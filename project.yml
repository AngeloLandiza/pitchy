name: Pitchy
options:
  bundleIdPrefix: com.angelolandiza
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pitchy:
    type: application
    platform: iOS
    sources:
      - path: Pitchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelolandiza.pitchy
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pitchy listens to your singing to check which note you hit. Audio never leaves your phone."
        INFOPLIST_KEY_CFBundleDisplayName: Pitchy
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  PitchyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitchyTests
    dependencies:
      - target: Pitchy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pitchy:
    build:
      targets:
        Pitchy: all
        PitchyTests: [test]
    test:
      targets:
        - PitchyTests
